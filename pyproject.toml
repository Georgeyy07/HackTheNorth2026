[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-training"
version = "0.1.0"
description = "Patch-based road roughness and disturbance learning, inference, and map replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "torch>=2.0"]

[project.optional-dependencies]
train = ["scipy>=1.11", "scikit-learn>=1.3", "tensorboard>=2.14,<3", "matplotlib>=3.8"]
prepare = ["h5py>=3.10", "pandas>=2.1,<3", "scipy>=1.11"]
viewer = ["fastapi==0.110.0", "uvicorn==0.27.0", "pandas==2.1.4", "pyarrow==22.0.0"]
alerts = ["fastapi==0.110.0", "uvicorn==0.27.0", "psycopg2-binary>=2.9"]
routing = ["osmnx>=2.0", "networkx>=3.0"]
test = ["pytest>=8", "httpx>=0.24,<0.28"]

[tool.setuptools.packages.find]
include = ["road_training*", "road_viewer*", "alert_service*", "route_planner*"]
exclude = ["road_training.tests*", "road_viewer.tests*", "road_viewer.node_modules*", "alert_service.tests*", "route_planner.tests*"]

[tool.setuptools.package-data]
road_viewer = ["static/*", "package.json", "package-lock.json"]

[tool.pytest.ini_options]
testpaths = ["road_training/tests", "road_viewer/tests", "alert_service/tests", "route_planner/tests"]
pythonpath = ["."]
